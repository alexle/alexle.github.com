name: create-post-from-issue

on:
  issues:
    types: [labeled]

jobs:
  create-post:
    if: github.event.label.name == 'new-post' || contains(github.event.issue.labels.*.name, 'new-post')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Create blog post from issue
        id: create-post
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          BODY="$ISSUE_BODY"

          # Validate body is not empty
          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            echo "error=empty" >> $GITHUB_OUTPUT
            echo "Issue body is empty — skipping post creation."
            exit 0
          fi

          DATE=$(date +%Y-%m-%d)
          YEAR=$(date +%Y)
          FILENAME=$(
            POST_DATE="$DATE" \
            POST_DIRECTORY="_posts/$YEAR" \
            scripts/issue-to-post.sh
          )
          SLUG=${FILENAME#"$DATE-"}
          SLUG=${SLUG%.markdown}

          # Set outputs for subsequent steps
          echo "slug=${SLUG}" >> $GITHUB_OUTPUT

          # Configure git
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add "_posts/$YEAR/$FILENAME"
          git commit -m "Add new post: $ISSUE_TITLE"
          git push

      - name: Comment on issue (empty body)
        if: steps.create-post.outputs.error == 'empty'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              ...context.issue,
              body: `⚠️ Issue body is empty — no post was created. Add content and re-apply the \`new-post\` label.`
            });

      - name: Comment on issue (success)
        if: steps.create-post.outputs.error != 'empty'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const slug = "${{ steps.create-post.outputs.slug }}";
            const url = `https://alexanderle.com/${slug}`;
            await github.rest.issues.createComment({
              ...context.issue,
              body: `✅ Post published! View it at: ${url}`
            });
            await github.rest.issues.update({
              ...context.issue,
              state: 'closed'
            });
